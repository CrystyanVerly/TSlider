<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description" content="tslider — a lightweight and accessible image slider built with TypeScript." />

  <title>tslider</title>
</head>

<body>
  <div id="app">
    <section>
      <div id="slide-wrapper" class="sliderContainer" data-slide="wrapper">
        <ul id="slide-rail" class="slideRail" data-slide="rail">
          <li data-slide="slide">
            <img src="./src/assets/img/fox.webp" alt="Fox" width="2560" height="1704" fetchpriority="high" />

          </li>

          <li data-slide="slide">
            <img src="./src/assets/img/botafogo.webp" alt="Botafogo" width="2560" height="1707" loading="lazy" />
          </li>

          <li data-slide="slide">
            <img src="./src/assets/img/bird.webp" alt="Bird" width="2560" height="1707" loading="lazy" />
          </li>

          <li data-slide="slide">
            <img src="./src/assets/img/calcadao.webp" alt="Boardwalk" width="2560" height="1707" fetchpriority="high" />
          </li>

          <li data-slide="slide">
            <img src="./src/assets/img/bear.webp" alt="Bear" width="2560" height="1707" loading="lazy" />
          </li>

          <li data-slide="slide">
            <img src="./src/assets/img/crocodile.webp" alt="Crocodile" width="2560" height="1701" loading="lazy" />
          </li>
        </ul>
      </div>
    </section>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
